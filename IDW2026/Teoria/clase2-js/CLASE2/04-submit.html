<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit  y Event </title>
</head>
<body>
    <!-- HTML (index.html) -->
<form id="mi-form">
  <label for="nombre">Nombre:</label>
  <input type="text" id="nombre" placeholder="Ingresa tu nombre"> <br>
  <label for="user-email">Correo electrónico:</label>
  <input type="email" id="user-email" placeholder="usuario@ejemplo.com"> <br>

  <!-- El botón con type="submit" (o presionar Enter) dispara el evento submit del formulario -->
  <button type="submit">Enviar</button>
</form>

<!-- Vinculación con el archivo de script -->
<script src="submit.js"></script>
</body>
</html>
